commands:

  - name: "CF_COUNTRY=not-set removes the CF-IPCountry header from the effective configuration"
    command: 'timeout 20 bash -c "until [ -s /var/run/nginx.pid ]; do sleep 0.2; done" && out=$(nginx -T 2>&1) && echo "$out" | grep -q "test is successful" && echo "$out" | grep -q "X-Real-IP" && ! echo "$out" | grep -q "CF-IPCountry" && echo SVRUNIT_PASS'
    expected: "SVRUNIT_PASS"
