commands:

  - name: "ACCESS_LOG=0 keeps access logs disabled in the effective configuration"
    command: 'timeout 20 bash -c "until [ -s /var/run/nginx.pid ]; do sleep 0.2; done" && out=$(nginx -T 2>&1) && echo "$out" | grep -q "access_log off;" && ! echo "$out" | grep -q "access_log /var/log/nginx/access.log" && echo SVRUNIT_PASS'
    expected: "SVRUNIT_PASS"
