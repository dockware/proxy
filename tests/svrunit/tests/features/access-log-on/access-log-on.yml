commands:

  - name: "ACCESS_LOG=1 enables access logs in the effective configuration"
    command: 'timeout 20 bash -c "until [ -s /var/run/nginx.pid ]; do sleep 0.2; done" && out=$(nginx -T 2>&1) && echo "$out" | grep -q "access_log /var/log/nginx/access.log;" && ! echo "$out" | grep -q "access_log off;" && echo SVRUNIT_PASS'
    expected: "SVRUNIT_PASS"

  - name: "Access log is written to the container output"
    command: 'test "$(readlink /var/log/nginx/access.log)" = "/dev/stdout" && echo SVRUNIT_PASS'
    expected: "SVRUNIT_PASS"

  - name: "NGINX configuration test is successful with access logs"
    command: 'timeout 20 bash -c "until [ -s /var/run/nginx.pid ]; do sleep 0.2; done" && nginx -t 2>&1'
    expected: "test is successful"
